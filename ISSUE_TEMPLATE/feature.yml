name: Funcionalidad
description: Proponer algo nuevo o una mejora
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo debería funcionar.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] ...
        - [ ] ...
