name: Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurrió en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir ...
        2. Pulsar ...
        3. Ver el error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / commit
  - type: textarea
    id: extra
    attributes:
      label: Capturas, logs o contexto extra
